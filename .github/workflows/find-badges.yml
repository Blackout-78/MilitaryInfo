name: Find badge candidates
on: workflow_dispatch
jobs:
  find:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - run: pip install pillow
      - run: python3 tools/find_badges.py || true
      - name: Publish candidates to a scratch branch
        run: |
          cd cands && git init -q -b badge-cands && git config user.email a@b.c && git config user.name bot
          git add -A && git commit -q -m "candidates" && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" badge-cands
