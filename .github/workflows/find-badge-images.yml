name: Find badge image candidates
on: workflow_dispatch
jobs:
  find:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: python3 tools/find_badge_images.py
      - uses: actions/upload-artifact@v4
        with:
          name: badge-cands
          path: cands/
