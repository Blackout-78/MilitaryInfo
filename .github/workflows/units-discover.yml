name: Discover unit insignia
on: workflow_dispatch
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: pip install pillow
      - run: python3 tools/units_discover.py || true
      - name: Publish to scratch branch
        run: |
          cd cands && git init -q -b unit-cands && git config user.email a@b.c && git config user.name bot
          git add -A && git commit -q -m "unit candidates" && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" unit-cands
