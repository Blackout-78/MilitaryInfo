name: Fetch army rank images
on: workflow_dispatch
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - run: pip install cairosvg
      - run: python3 tools/fetch_army_ranks.py
      - name: Publish to scratch branch
        run: |
          cd out && git init -q -b army-ranks && git config user.email a@b.c && git config user.name bot
          git add -A && git commit -q -m "army ranks" && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" army-ranks
