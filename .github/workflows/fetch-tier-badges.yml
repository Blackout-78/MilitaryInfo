name: Fetch tier badge images
on: workflow_dispatch
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: python3 tools/fetch_tier_badges.py
      - name: Publish to scratch branch
        run: |
          cd out && git init -q -b tier-final && git config user.email a@b.c && git config user.name bot
          git add -A && git commit -q -m "tier images" && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" tier-final
