name: Find rank image candidates
on: workflow_dispatch
jobs:
  find:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: pip install pillow
      - run: python3 tools/find_rank_images.py
      - name: Publish candidates to a scratch branch
        run: |
          cd cands && git init -q -b rank-cands && git config user.email a@b.c && git config user.name bot
          git add -A && git commit -q -m "candidates" && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" rank-cands
